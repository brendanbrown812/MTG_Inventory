services:
  backend:
    build:
      context: ./backend
    environment:
      # Absolute path inside the container; matched to the db_data volume below
      DATABASE_URL: sqlite:////data/mtg_inventory.db
      # Set this to the URL(s) you use to access Spellbinder (comma-separated, no trailing slash).
      # Include your Cloudflare Tunnel domain when you have one, e.g.:
      #   CORS_ORIGINS=https://spellbinder.yourdomain.com
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8888}
      APP_API_KEY: ${APP_API_KEY:-}
      REQUIRE_AUTH: ${REQUIRE_AUTH:-true}
      EXTERNAL_AUTH_ENABLED: ${EXTERNAL_AUTH_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_REQUESTS_ENABLED: ${OPENAI_REQUESTS_ENABLED:-false}
      OPENAI_MONTHLY_BUDGET_USD: ${OPENAI_MONTHLY_BUDGET_USD:-1.00}
      OPENAI_SINGLE_REQUEST_LIMIT_USD: ${OPENAI_SINGLE_REQUEST_LIMIT_USD:-0.10}
      REASONING_PROVIDER: ${REASONING_PROVIDER:-openai}
      REASONING_MODEL: ${REASONING_MODEL:-gpt-5.6-luna}
      REASONING_EFFORT: ${REASONING_EFFORT:-medium}
      REASONING_MAX_OUTPUT_TOKENS: ${REASONING_MAX_OUTPUT_TOKENS:-6000}
      REVIEW_PROVIDER: ${REVIEW_PROVIDER:-openai}
      REVIEW_MODEL: ${REVIEW_MODEL:-gpt-5.6-luna}
      REVIEW_REASONING_EFFORT: ${REVIEW_REASONING_EFFORT:-low}
      REVIEW_MAX_OUTPUT_TOKENS: ${REVIEW_MAX_OUTPUT_TOKENS:-4000}
      REVIEW_FALLBACK_MODEL: ${REVIEW_FALLBACK_MODEL:-rules-v1}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-120}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-2}
      ENRICHMENT_PROVIDER: ${ENRICHMENT_PROVIDER:-openai}
      ENRICHMENT_MODEL: ${ENRICHMENT_MODEL:-gpt-5.6-luna}
      ENRICHMENT_REASONING_EFFORT: ${ENRICHMENT_REASONING_EFFORT:-low}
      ENRICHMENT_MAX_OUTPUT_TOKENS_PER_CARD: ${ENRICHMENT_MAX_OUTPUT_TOKENS_PER_CARD:-900}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-512}
      EMBEDDING_REQUEST_BATCH_SIZE: ${EMBEDDING_REQUEST_BATCH_SIZE:-100}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - db_data:/data
      - ./backups:/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    ports:
      - "${PORT:-8888}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
    name: spellbinder_db_data
