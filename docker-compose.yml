services:
  backend:
    build:
      context: ./backend
    environment:
      # Absolute path inside the container; matched to the db_data volume below
      DATABASE_URL: sqlite:////data/mtg_inventory.db
      # Set this to the URL(s) you use to access Spellbinder (comma-separated, no trailing slash).
      # Include your Cloudflare Tunnel domain when you have one, e.g.:
      #   CORS_ORIGINS=https://spellbinder.yourdomain.com
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8888}
      APP_API_KEY: ${APP_API_KEY:-}
      REQUIRE_AUTH: ${REQUIRE_AUTH:-true}
      EXTERNAL_AUTH_ENABLED: ${EXTERNAL_AUTH_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ENRICHMENT_PROVIDER: ${ENRICHMENT_PROVIDER:-anthropic}
      ENRICHMENT_MODEL: ${ENRICHMENT_MODEL:-claude-haiku-4-5-20251001}
      REASONING_PROVIDER: ${REASONING_PROVIDER:-anthropic}
      REASONING_MODEL: ${REASONING_MODEL:-claude-sonnet-4-6}
      DECKBUILDING_MODEL: ${DECKBUILDING_MODEL:-claude-sonnet-4-6}
    volumes:
      - db_data:/data
      - ./backups:/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    ports:
      - "${PORT:-8888}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
    name: spellbinder_db_data
